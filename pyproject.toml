[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xuen"
version = "0.2.0"
description = "随机灵感词驱动的外部 agent 研究者模拟循环（TUI）"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0", "textual>=1.0"]

[project.scripts]
xuen = "xuen.cli:main"

[tool.setuptools]
packages = ["xuen"]
