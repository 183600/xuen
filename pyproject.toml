[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xuen"
version = "0.3.0"
description = "随机灵感词驱动的外部 agent 研究者模拟循环（TUI）"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "183600"}]
dependencies = ["PyYAML>=6.0", "textual>=1.0", "rich>=14.2.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "pytest-cov>=4"]

[project.urls]
Homepage = "https://github.com/183600/xuen"
Repository = "https://github.com/183600/xuen"
Issues = "https://github.com/183600/xuen/issues"

[project.scripts]
xuen = "xuen.cli:main"

[tool.setuptools]
packages = ["xuen"]
