name: OpenCode Issue

# 用法：由仓库所有者 183600 新建（或重新打开）一个 issue。
# issue 的正文就是 prompt（标题不提供给模型，仅用于人工索引和 commit message），OpenCode 会直接修改默认分支并推送（不建 PR）。
# 开始前会取消其他 workflow 的运行并临时禁用它们；结束后（无论本次运行成功还是失败）
# 会重新启用它们，并立即重新触发（workflow_dispatch）支持手动触发的 workflow。
# 模型优先使用 OpenCode 自带的免费 deepseek-v4.1-flash-free：
# 若模型列表中暂时找不到它，会刷新模型目录后反复重试，最多 5 次；
# 5 次后仍没有 deepseek-v4.1-flash-free 但找到其他免费模型时，改用其他免费模型
# （big-pickle 优先，再次为随机免费模型）；任何时候都优先 deepseek-v4.1-flash-free。
#
# 推送凭据说明（重要）：
# GITHUB_TOKEN 没有 workflows 权限，一旦本次提交改动/新增 .github/workflows/ 下的文件，
# 用它推送会被 GitHub 拒绝（"refusing to allow a GitHub App to create or update workflow ..."）。
# 因此本 workflow 依赖仓库 Actions secret「PUSH_TOKEN」（内容为带 repo+workflow scope 的 PAT）：
# - 提交涉及 workflow 文件时，用 PUSH_TOKEN 推送；
# - 普通代码改动优先 GITHUB_TOKEN，失败时也用 PUSH_TOKEN 兜底重试；
# - 未配置 PUSH_TOKEN 时普通改动仍可正常推送，但 workflow 文件改动会被拒（评论中会有明确提示）。

on:
  issues:
    types: [opened, reopened]

# 使用 GITHUB_TOKEN 直接推默认分支，不建 PR。
# actions: write 用于暂停/恢复/重新触发其他 workflow；issues: write 用于评论和关闭 issue。
permissions:
  contents: write
  issues: write
  actions: write

# 全局串行：一次只跑一个 issue，避免多个任务同时直接推默认分支。
# cancel-in-progress=false：不会取消正在运行的 issue 任务。
concurrency:
  group: opencode-issue
  cancel-in-progress: false

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  NO_COLOR: '1'
  FORCE_COLOR: '0'
  TERM: dumb
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

jobs:
  opencode:
    # actor 校验确保只有 183600 本人新建/重新打开 issue 才会运行，
    # 避免其他人重新打开旧 issue 时误触发。
    if: github.actor == '183600' && github.event.issue.user.login == '183600'
    # 把 suspend 步骤记录的「被暂停 workflow 清单」传给 resume-workflows 兜底 job，
    # 保证本 job 被取消/超时之后恢复动作仍能完成。
    outputs:
      suspended_workflows: ${{ steps.suspend.outputs.suspended }}
    runs-on: ubuntu-latest
    # GitHub 托管 runner 单 job 硬上限 360 分钟，取满。
    timeout-minutes: 360

    steps:
      - name: Suspend other workflows
        id: suspend
        shell: bash
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          STATE_FILE=/tmp/opencode-suspended-workflows.json
          echo '{"disabled":[],"canceled":[]}' > "$STATE_FILE"

          CURRENT_WF_PATH=".github/workflows/opencode-issue.yml"
          CURRENT_WF_ID="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/opencode-issue.yml" \
            --jq '.id')"
          if [ -z "$CURRENT_WF_ID" ]; then
            echo "[suspend][error] 无法确定当前 workflow 的 id" >&2
            # 失败前也要把（空）清单写进 output，兜底 job 不会误走扫描分支
            echo "suspended=$(jq -c '{disabled: .disabled}' "$STATE_FILE")" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # 先禁用其他 active workflow，阻止它们在本次任务期间启动新 run。
          WORKFLOWS_TSV="$(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/workflows" \
              --jq '.workflows[] | [.id, .path, .state, .name] | @tsv'
          )"
          DISABLED=0
          declare -A EXCLUDED_WF=()
          while IFS=$'\t' read -r id path state name; do
            [ -n "$id" ] || continue
            if [ "$id" = "$CURRENT_WF_ID" ] || [ "$path" = "$CURRENT_WF_PATH" ]; then
              EXCLUDED_WF[$id]=1
              continue
            fi
            case "$path" in
              .github/workflows/*) ;;
              *)
                # GitHub 托管的 dynamic workflow（例如 Dependabot update graph）
                # 不是仓库里的普通 workflow，disable/cancel 可能失败，直接跳过。
                EXCLUDED_WF[$id]=1
                echo "[suspend] skip GitHub-managed workflow ${name} (${path})"
                continue
                ;;
            esac
            [ "$state" = "active" ] || continue

            if gh workflow disable "$id" --repo "$GITHUB_REPOSITORY" >/dev/null; then
              DISABLED=$((DISABLED + 1))
              jq --arg id "$id" --arg name "$name" --arg path "$path" \
                '.disabled += [{"id": $id, "name": $name, "path": $path}]' \
                "$STATE_FILE" > "$STATE_FILE.tmp"
              mv "$STATE_FILE.tmp" "$STATE_FILE"
              echo "[suspend] disabled ${name} (${path})"
            else
              echo "[suspend][error] 禁用 ${name} (${path}) 失败" >&2
              # 失败前把已禁用清单写进 output，兜底 job 可以据此恢复
              echo "suspended=$(jq -c '{disabled: .disabled}' "$STATE_FILE")" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done <<< "$WORKFLOWS_TSV"

          # 已禁用清单写入 step output（紧凑 JSON），供 resume-workflows 兜底 job 使用。
          # 写在这里：即使后面「等待其他 runs 停止」超时导致本步骤失败，
          # 这份清单也已经记录在案。
          echo "suspended=$(jq -c '{disabled: .disabled}' "$STATE_FILE")" >> "$GITHUB_OUTPUT"

          # 取消其他 workflow 正在运行/排队的 run，并等待它们真正停止。
          CANCELED=0
          declare -A SEEN_CANCELED=()
          DEADLINE=$((SECONDS + 180))
          while :; do
            ACTIVE_RUNS="$(
              gh run list --repo "$GITHUB_REPOSITORY" --limit 200 \
                --json databaseId,workflowDatabaseId,status \
              | jq -r '.[] | select(.status != "completed") | [.databaseId, .workflowDatabaseId] | @tsv'
            )"
            PENDING=0
            while IFS=$'\t' read -r run_id wf_id; do
              [ -n "$run_id" ] || continue
              if [ -n "$wf_id" ] && [ -n "${EXCLUDED_WF[$wf_id]:-}" ]; then
                continue
              fi
              PENDING=$((PENDING + 1))
              if gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                if [ -z "${SEEN_CANCELED[$run_id]:-}" ]; then
                  SEEN_CANCELED[$run_id]=1
                  CANCELED=$((CANCELED + 1))
                  jq --arg id "$run_id" '.canceled += [{"id": $id}]' \
                    "$STATE_FILE" > "$STATE_FILE.tmp"
                  mv "$STATE_FILE.tmp" "$STATE_FILE"
                  echo "[suspend] cancel requested for run ${run_id}"
                fi
              fi
            done <<< "$ACTIVE_RUNS"

            if [ "$PENDING" -eq 0 ]; then
              break
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "[suspend][error] 等待其他 workflow runs 停止超时" >&2
              gh run list --repo "$GITHUB_REPOSITORY" --limit 20 \
                --json databaseId,status,workflowName,workflowDatabaseId,url \
              | jq -r '.[] | select(.status != "completed")' >&2 || true
              exit 1
            fi
            sleep 5
          done

          echo "disabled=$DISABLED" >> "$GITHUB_OUTPUT"
          echo "canceled=$CANCELED" >> "$GITHUB_OUTPUT"
          echo "[suspend] done: disabled=${DISABLED}, canceled=${CANCELED}"

      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-opencode-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-opencode-

      - name: Install OpenCode
        shell: bash
        run: npm i -g opencode-ai

      - name: Select a free OpenCode model
        id: select
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail

          PREFERRED_DEEPSEEK="opencode/deepseek-v4.1-flash-free"
          PREFERRED_PICKLE="opencode/big-pickle"

          KNOWN_FREE=(
            "opencode/beam-free"
            "opencode/flint-40b-free"
            "opencode/glm-5.3-flash-free"
            "opencode/mimo-v2.6-flash-free"
            "opencode/nemotron-3-ultra-free"
            "opencode/nemotron-3.5-lightning-free"
            "opencode/nemotron-3.5-super-vl-free"
          )

          # ---------- 阶段 1：在模型列表中查找 deepseek-v4.1-flash-free，最多重试 5 次 ----------
          # 模型目录可能瞬时抖动（缓存未刷新 / 网关暂时摘下该模型）。
          # 找不到首选模型时不立即放弃：每次先刷新 opencode 的模型目录缓存再读取列表，
          # 间隔 60s 重试，最多 5 次；一旦找到立即进入候选构建。
          MAX_LIST_ATTEMPTS=5
          RETRY_INTERVAL=60
          AVAILABLE=()
          DEEPSEEK_FOUND=0

          for attempt in $(seq 1 "$MAX_LIST_ATTEMPTS"); do
            timeout 60 opencode models opencode --refresh >/dev/null 2>&1 || true
            AVAILABLE=()
            while IFS= read -r m; do
              [ -n "$m" ] && AVAILABLE+=("$m")
            done < <(timeout 60 opencode models 2>/dev/null | awk '/^[[:space:]]*opencode\//{print $1}')

            for m in "${AVAILABLE[@]:-}"; do
              if [ "$m" = "$PREFERRED_DEEPSEEK" ]; then
                DEEPSEEK_FOUND=1
                break
              fi
            done

            if [ "$DEEPSEEK_FOUND" -eq 1 ]; then
              echo "[model] 第 ${attempt}/${MAX_LIST_ATTEMPTS} 次查找：在模型列表中找到 ${PREFERRED_DEEPSEEK}（列表共 ${#AVAILABLE[@]} 个模型）"
              break
            fi

            echo "[model] 第 ${attempt}/${MAX_LIST_ATTEMPTS} 次查找：模型列表中没有 ${PREFERRED_DEEPSEEK}（列表共 ${#AVAILABLE[@]} 个模型）"
            if [ "$attempt" -lt "$MAX_LIST_ATTEMPTS" ]; then
              echo "[model] ${RETRY_INTERVAL}s 后刷新模型目录并重试..."
              sleep "$RETRY_INTERVAL"
            fi
          done

          # ---------- 阶段 2：按优先级构建候选列表 ----------
          has_available() {
            local wanted="$1" m
            for m in "${AVAILABLE[@]:-}"; do
              [ "$m" = "$wanted" ] && return 0
            done
            return 1
          }

          add_candidate() {
            local m="$1" existing
            for existing in "${CANDIDATES[@]:-}"; do
              [ "$existing" = "$m" ] && return 0
            done
            CANDIDATES+=("$m")
          }

          CANDIDATES=()
          RANDOM_POOL=()

          if [ "$DEEPSEEK_FOUND" -eq 1 ]; then
            # 首选模型在列表中：deepseek 排第一，其余免费模型仅作冒烟后备。
            add_candidate "$PREFERRED_DEEPSEEK"
            if has_available "$PREFERRED_PICKLE"; then add_candidate "$PREFERRED_PICKLE"; fi
            for m in "${AVAILABLE[@]:-}"; do
              case "$m" in
                "$PREFERRED_DEEPSEEK"|"$PREFERRED_PICKLE") continue ;;
                opencode/*-free) RANDOM_POOL+=("$m") ;;
              esac
            done
          elif [ "${#AVAILABLE[@]}" -eq 0 ]; then
            # 重试 5 次后模型列表仍读不到：无法确认首选是否真的下线，
            # 按已知候选依次冒烟（deepseek 仍排第一，符合「优先 deepseek」策略）。
            echo "[model] 模型列表不可读（已重试 ${MAX_LIST_ATTEMPTS} 次），按已知候选依次尝试"
            add_candidate "$PREFERRED_DEEPSEEK"
            add_candidate "$PREFERRED_PICKLE"
            RANDOM_POOL=("${KNOWN_FREE[@]:0:6}")
          else
            # 重试 5 次后确认列表里没有 deepseek-v4.1-flash-free：
            # 改用其他免费模型（big-pickle 优先，其次随机其他免费模型）。
            echo "[model] 已重试 ${MAX_LIST_ATTEMPTS} 次仍未找到 ${PREFERRED_DEEPSEEK}，回退到其他免费模型"
            if has_available "$PREFERRED_PICKLE"; then
              add_candidate "$PREFERRED_PICKLE"
            else
              echo "[model] 模型列表中没有 ${PREFERRED_PICKLE}，跳过"
            fi
            for m in "${AVAILABLE[@]:-}"; do
              case "$m" in
                "$PREFERRED_DEEPSEEK"|"$PREFERRED_PICKLE") continue ;;
                opencode/*-free) RANDOM_POOL+=("$m") ;;
              esac
            done
            # 列表里连一个免费候选都没有时，用已知免费模型池兜底。
            if [ "${#RANDOM_POOL[@]}" -eq 0 ] && [ "${#CANDIDATES[@]}" -eq 0 ]; then
              echo "[model] 列表中没有其他免费模型，使用已知免费模型池兜底"
              RANDOM_POOL=("${KNOWN_FREE[@]:0:6}")
            fi
          fi

          # 去重并随机打乱兜底池。
          if [ "${#RANDOM_POOL[@]}" -gt 0 ]; then
            mapfile -t RANDOM_POOL < <(printf '%s\n' "${RANDOM_POOL[@]}" | awk 'NF && !seen[$0]++' | shuf)
            # 只取随机池前 6 个，避免候选太多导致冒烟测试超时。
            for m in "${RANDOM_POOL[@]:0:6}"; do add_candidate "$m"; done
          fi

          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "[model][error] 没有任何候选免费模型" >&2
            exit 1
          fi

          echo "[model] 候选顺序：${CANDIDATES[*]}"

          SMOKE_DIR="$RUNNER_TEMP/opencode-smoke"
          mkdir -p "$SMOKE_DIR"
          SELECTED=""
          for m in "${CANDIDATES[@]}"; do
            echo "[model] 测试 $m ..."
            # 每个候选都做一次真实冒烟调用，避免选中目录里存在但实际不可用的模型。
            if ( cd "$SMOKE_DIR" && timeout --kill-after=30 180 opencode run --auto -m "$m" "只回复两个字：OK" ) > "$SMOKE_DIR/smoke.log" 2>&1; then
              echo "[model] 可用：$m"
              SELECTED="$m"
              break
            fi
            echo "[model] 不可用：$m"
            tail -n 20 "$SMOKE_DIR/smoke.log" 2>/dev/null || true
          done

          if [ -z "$SELECTED" ]; then
            echo "[model][error] 所有候选免费模型均不可用" >&2
            exit 1
          fi

          echo "model=$SELECTED" >> "$GITHUB_OUTPUT"
          echo "[model] 最终选择：$SELECTED"

      - name: Run OpenCode on issue
        id: run
        continue-on-error: true
        shell: bash
        # 步骤预算 290 分钟：suspend(10) + select(40) + run(290) = 340 ≤ job 上限 360，
        # 给 publish/resume/comment/close 等收尾步骤留约 20 分钟。
        timeout-minutes: 290
        env:
          MODEL: ${{ steps.select.outputs.model }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          set -o pipefail
          LOG=/tmp/opencode-run.log

          {
            echo "你正在 GitHub Actions 中处理仓库 ${GITHUB_REPOSITORY} 的 issue #${ISSUE_NUMBER}。"
            echo
            echo "Issue 正文："
            printf '%s\n' "${ISSUE_BODY}"
            echo
            echo "要求："
            echo "1. 严格按照 issue 中的要求修改当前仓库的代码。"
            echo "2. 可以运行必要的测试或命令来验证修改。"
            echo "3. 不要执行 git commit / git push；工作流会直接把修改提交并推送到默认分支。"
            echo "4. 不要操作 GitHub Actions 的 workflow/run（不要启用、禁用、取消或触发其他 workflow）；这些由工作流完成。"
            echo "5. 除非 issue 明确要求，不要删除或修改 .github/workflows/ 下的 CI 配置。"
            echo "6. 完成后用简短中文总结你做的修改和验证结果。"
          } > /tmp/opencode-prompt.txt

          PROMPT="$(cat /tmp/opencode-prompt.txt)"
          echo "[opencode] model=$MODEL issue=#$ISSUE_NUMBER"
          # 280 分钟（16800s）硬超时：比步骤上限 290 分钟留 10 分钟余量；
          # --kill-after=120 给 opencode 更充分的优雅退出时间。
          timeout --kill-after=120 16800 opencode run --auto -m "$MODEL" "$PROMPT" 2>&1 | tee "$LOG"
          EC=${PIPESTATUS[0]}
          echo "exit_code=$EC" >> "$GITHUB_OUTPUT"
          echo "[opencode] exit=$EC"
          exit 0

      - name: Commit and push to default branch
        id: publish
        if: steps.run.outputs.exit_code == '0'
        shell: bash
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 带 repo+workflow scope 的 PAT（仓库 Actions secret：PUSH_TOKEN）。
          # GITHUB_TOKEN 是 GitHub App token，永远没有 workflows 权限；
          # 只要提交里改动/新增 .github/workflows/ 下的文件，用它推送就会被拒：
          # "refusing to allow a GitHub App to create or update workflow ... without workflows permission"。
          # 因此涉及 workflow 文件的提交必须改用 PUSH_TOKEN 推送。
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          MODEL: ${{ steps.select.outputs.model }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config i18n.commitEncoding utf-8
          git config core.quotepath false

          AHEAD="$(git rev-list --count "origin/${BASE_BRANCH}..HEAD")"
          DIRTY="$(git status --porcelain)"

          if [ "$AHEAD" -eq 0 ] && [ -z "$DIRTY" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[publish] OpenCode 没有产生代码修改"
            exit 0
          fi

          if [ -n "$DIRTY" ]; then
            git add -A
            # 暂存区为空时不要执行 git commit（否则 "nothing to commit" 会直接把本步骤打挂）。
            if git diff --cached --quiet; then
              echo "[publish] 工作区有状态变化但没有可提交内容，跳过 commit"
            else
              SAFE_TITLE="${ISSUE_TITLE//$'\n'/ }"
              SAFE_TITLE="${SAFE_TITLE:0:80}"
              git commit -m "opencode: issue #${ISSUE_NUMBER} ${SAFE_TITLE}" \
                         -m "Model: ${MODEL}" \
                         -m "Generated by OpenCode in GitHub Actions."
            fi
          fi

          # 把修改 rebase 到最新默认分支，避免任务期间别人推送导致非快进。
          git fetch origin "$BASE_BRANCH"
          if ! git merge-base --is-ancestor "origin/${BASE_BRANCH}" HEAD; then
            if ! git rebase "origin/${BASE_BRANCH}"; then
              git rebase --abort || true
              echo "[publish][error] rebase onto origin/${BASE_BRANCH} 失败" >&2
              exit 1
            fi
          fi

          # rebase 后重新确认确实有要推送的提交（OpenCode 可能只留下不可提交的状态变化）。
          AHEAD="$(git rev-list --count "origin/${BASE_BRANCH}..HEAD")"
          if [ "$AHEAD" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[publish] OpenCode 没有产生可推送的提交"
            exit 0
          fi

          # 检查待推送提交是否涉及 .github/workflows/ 下的文件。
          # GITHUB_TOKEN 没有 workflows 权限，推不动这类改动，必须用 PAT。
          WF_TOUCHED="$(git diff --name-only "origin/${BASE_BRANCH}..HEAD" -- .github/workflows/ | grep -c . || true)"

          if [ "${WF_TOUCHED:-0}" -gt 0 ]; then
            if [ -n "${PUSH_TOKEN:-}" ]; then
              echo "[publish] 提交涉及 .github/workflows/ 下的 ${WF_TOUCHED} 个文件，使用 PUSH_TOKEN（PAT）推送"
              if ! git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BASE_BRANCH}"; then
                echo "[publish][error] PUSH_TOKEN 推送失败：请检查仓库 secret PUSH_TOKEN 是否为有效且带 repo+workflow scope 的 PAT" >&2
                exit 1
              fi
            else
              echo "[publish][warn] 提交涉及 .github/workflows/ 但未配置 PUSH_TOKEN secret，先尝试 GITHUB_TOKEN" >&2
              if ! git push origin "HEAD:${BASE_BRANCH}"; then
                echo "[publish][error] GITHUB_TOKEN 推送被拒（提交包含 workflow 文件改动）。请在仓库 Settings → Secrets and variables → Actions 添加名为 PUSH_TOKEN 的 secret（内容为带 repo+workflow scope 的 PAT）后重试" >&2
                exit 1
              fi
            fi
          else
            # 普通代码改动：优先 GITHUB_TOKEN，失败时用 PUSH_TOKEN 兜底重试。
            if ! git push origin "HEAD:${BASE_BRANCH}"; then
              if [ -n "${PUSH_TOKEN:-}" ]; then
                echo "[publish][warn] GITHUB_TOKEN 推送失败，改用 PUSH_TOKEN 重试" >&2
                if ! git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BASE_BRANCH}"; then
                  echo "[publish][error] PUSH_TOKEN 推送也失败，请检查网络与凭据" >&2
                  exit 1
                fi
              else
                echo "[publish][error] git push 失败" >&2
                exit 1
              fi
            fi
          fi

          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "[publish] 已推送到 ${BASE_BRANCH}: $COMMIT_SHA"

      - name: Upload OpenCode log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: opencode-issue-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/opencode-run.log
            /tmp/opencode-prompt.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Resume and retrigger other workflows
        id: resume
        if: always()
        shell: bash
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail

          STATE_FILE=/tmp/opencode-suspended-workflows.json
          REENABLED=0
          ENABLE_FAILED=0
          TRIGGERED=0
          TRIGGER_FAILED=0
          TRIGGER_SKIPPED=0

          write_outputs() {
            echo "reenabled=$REENABLED" >> "$GITHUB_OUTPUT"
            echo "failed=$ENABLE_FAILED" >> "$GITHUB_OUTPUT"
            echo "triggered=$TRIGGERED" >> "$GITHUB_OUTPUT"
            echo "trigger_failed=$TRIGGER_FAILED" >> "$GITHUB_OUTPUT"
            echo "trigger_skipped=$TRIGGER_SKIPPED" >> "$GITHUB_OUTPUT"
            echo "[resume] done: reenabled=${REENABLED}, enable_failed=${ENABLE_FAILED}, triggered=${TRIGGERED}, trigger_failed=${TRIGGER_FAILED}, trigger_skipped=${TRIGGER_SKIPPED}"
          }

          if [ ! -f "$STATE_FILE" ]; then
            write_outputs
            echo "[resume] 没有需要恢复的 workflow"
            exit 0
          fi

          # workflow 文件是否带 workflow_dispatch 触发器。
          # 读取远程默认分支上的文件内容判断，避免被本地（OpenCode 的）改动干扰。
          supports_dispatch() {
            local path="$1" content
            content="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${DEFAULT_BRANCH}" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)"
            [ -n "$content" ] && printf '%s' "$content" | grep -q 'workflow_dispatch'
          }

          # 该 workflow 是否已有排队中/运行中的 run，或 5 分钟内刚创建过 run
          #（避免与兜底 job / 刚完成的触发重复派发）。
          has_recent_run() {
            local file="$1" n
            n="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${file}/runs?per_page=10" \
              --jq '[.workflow_runs[] | select(.status != "completed" or ((now - (.created_at | fromdateiso8601)) < 300))] | length' 2>/dev/null || true)"
            case "$n" in ''|*[!0-9]*) n=0 ;; esac
            [ "$n" -gt 0 ]
          }

          # 重新启用一个 workflow（最多重试 5 次）。
          enable_workflow() {
            local id="$1" attempt
            for attempt in 1 2 3 4 5; do
              if gh workflow enable "$id" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                return 0
              fi
              echo "[resume][warn] 启用 workflow ${id} 失败（attempt ${attempt}/5），10s 后重试" >&2
              sleep 10
            done
            return 1
          }

          # 重新触发一个 workflow：workflow_dispatch 到默认分支（最多重试 5 次）。
          trigger_workflow() {
            local file="$1" attempt
            for attempt in 1 2 3 4 5; do
              if gh workflow run "$file" --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" >/dev/null 2>&1; then
                return 0
              fi
              echo "[resume][warn] 触发 ${file} 失败（attempt ${attempt}/5），10s 后重试" >&2
              sleep 10
            done
            return 1
          }

          DISABLED_TSV="$(jq -r '.disabled[] | [.id, .name, .path] | @tsv' "$STATE_FILE")"
          while IFS=$'\t' read -r id name path; do
            [ -n "$id" ] || continue
            file="${path##*/}"

            if enable_workflow "$id"; then
              REENABLED=$((REENABLED + 1))
              echo "[resume] re-enabled ${name} (${path})"
            else
              ENABLE_FAILED=$((ENABLE_FAILED + 1))
              echo "[resume][error] 启用 ${name} (${path}) 失败（已重试 5 次）" >&2
              continue
            fi

            # 重新启用之后立即重新触发（workflow_dispatch），
            # 让被中断的 workflow（例如 Continuous Loop）马上恢复运转，
            # 不必等到下一个 cron 周期。
            if ! supports_dispatch "$path"; then
              echo "[resume] ${name} 没有 workflow_dispatch 触发器，已重新启用，等待其自身事件/计划触发"
              TRIGGER_SKIPPED=$((TRIGGER_SKIPPED + 1))
              continue
            fi
            if has_recent_run "$file"; then
              echo "[resume] ${name} 已有排队中/运行中/刚创建的 run，无需重复触发"
              TRIGGER_SKIPPED=$((TRIGGER_SKIPPED + 1))
              continue
            fi
            if trigger_workflow "$file"; then
              TRIGGERED=$((TRIGGERED + 1))
              echo "[resume] re-triggered ${name} (${path}) on ${DEFAULT_BRANCH}"
            else
              TRIGGER_FAILED=$((TRIGGER_FAILED + 1))
              echo "[resume][error] 触发 ${name} (${path}) 失败（已重试 5 次）" >&2
            fi
          done <<< "$DISABLED_TSV"

          write_outputs

          if [ "$ENABLE_FAILED" -ne 0 ] || [ "$TRIGGER_FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Comment result on issue
        id: comment
        if: always()
        shell: bash
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SELECT_OUTCOME: ${{ steps.select.outcome }}
          SELECT_MODEL: ${{ steps.select.outputs.model }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
          RUN_EXIT: ${{ steps.run.outputs.exit_code }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PUBLISH_CHANGED: ${{ steps.publish.outputs.changed }}
          COMMIT_SHA: ${{ steps.publish.outputs.commit_sha }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SUSPEND_OUTCOME: ${{ steps.suspend.outcome }}
          DISABLED_COUNT: ${{ steps.suspend.outputs.disabled }}
          CANCELED_COUNT: ${{ steps.suspend.outputs.canceled }}
          RESUME_OUTCOME: ${{ steps.resume.outcome }}
          REENABLED_COUNT: ${{ steps.resume.outputs.reenabled }}
          TRIGGERED_COUNT: ${{ steps.resume.outputs.triggered }}
          RESUME_FAILED: ${{ steps.resume.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          COMMENT=/tmp/opencode-comment.md

          {
            echo "## OpenCode 运行结果"
            echo
            echo "- 模型：\`${SELECT_MODEL:-未选择}\`"
            echo "- Actions 日志：${RUN_URL}"
            echo

            if [ "$SELECT_OUTCOME" != "success" ]; then
              echo "❌ 模型选择失败：没有找到可用的免费模型。"
            elif [ "$RUN_OUTCOME" != "success" ] || [ "${RUN_EXIT:-}" != "0" ]; then
              echo "❌ OpenCode 执行失败（exit=${RUN_EXIT:-unknown}）。"
            elif [ "$PUBLISH_OUTCOME" != "success" ]; then
              echo "❌ OpenCode 已执行，但提交或推送失败。"
            elif [ "$PUBLISH_CHANGED" = "true" ] && [ -n "${COMMIT_SHA:-}" ]; then
              echo "✅ 已直接推送到 \`${BASE_BRANCH}\`："
              echo
              echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}"
            elif [ "$PUBLISH_CHANGED" = "true" ]; then
              echo "✅ 已推送到 \`${BASE_BRANCH}\`，但未能获取 commit SHA，请查看 Actions 日志。"
            else
              echo "ℹ️ OpenCode 已执行，但没有产生代码修改。"
            fi

            echo
            echo "### 其他 workflow"
            echo
            if [ "$SUSPEND_OUTCOME" = "success" ]; then
              echo "- 开始前：取消 ${CANCELED_COUNT:-0} 个运行，临时禁用 ${DISABLED_COUNT:-0} 个 workflow。"
            else
              echo "- ⚠️ 开始前暂停其他 workflow 失败，详见 Actions 日志。"
            fi

            if [ "$RESUME_OUTCOME" = "success" ]; then
              echo "- 结束后：已重新启用 ${REENABLED_COUNT:-0} 个 workflow，并重新触发 ${TRIGGERED_COUNT:-0} 个。"
            else
              echo "- ⚠️ 结束后恢复 workflow 失败（${RESUME_FAILED:-unknown} 个），请手动启用。"
            fi

            echo
            if [ -s /tmp/opencode-run.log ]; then
              echo "<details><summary>OpenCode 输出（末尾 120 行）</summary>"
              echo
              echo '````text'
              tail -n 120 /tmp/opencode-run.log | head -c 50000
              echo
              echo '````'
              echo
              echo "</details>"
            fi
          } > "$COMMENT"

          # GitHub issue 评论最多 65536 字符；按字符安全截断，避免切断 UTF-8。
          python3 - "$COMMENT" <<'PY'
          import re
          import sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8", errors="replace").read()
          # 去掉 OpenCode 输出里的 ANSI 颜色控制码，避免 issue 评论出现乱码。
          text = re.sub(r"\x1b\[[0-9;?]*[ -/]*[@-~]", "", text)
          open(path, "w", encoding="utf-8").write(text[:60000])
          PY

          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$COMMENT"

      - name: Close issue on success
        id: close
        if: |
          always() &&
          steps.select.outcome == 'success' &&
          steps.run.outcome == 'success' &&
          steps.run.outputs.exit_code == '0' &&
          steps.publish.outcome == 'success' &&
          steps.publish.outputs.changed == 'true'
        shell: bash
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          STATE="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
          if [ "$STATE" = "OPEN" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
            echo "[close] issue #${ISSUE_NUMBER} closed"
          else
            echo "[close] issue #${ISSUE_NUMBER} is already ${STATE}"
          fi

      - name: Fail job if OpenCode failed
        if: |
          always() && (
            steps.suspend.outcome != 'success' ||
            steps.select.outcome != 'success' ||
            steps.run.outcome != 'success' ||
            steps.run.outputs.exit_code != '0' ||
            steps.publish.outcome == 'failure' ||
            steps.resume.outcome != 'success' ||
            steps.comment.outcome == 'failure' ||
            steps.close.outcome == 'failure'
          )
        shell: bash
        run: |
          echo "OpenCode issue workflow failed; see the issue comment and Actions log."
          exit 1

  resume-workflows:
    # 兜底保障：opencode job 无论成功、失败、被取消还是超时（runner 宕机），
    # 这个 job 都会紧接着启动（needs + if: always()，与 Continuous Loop 的
    # next-run job 相同的已验证模式），确保被暂停的其他 workflow 一定被
    # 重新启用并重新触发——不依赖 opencode job 内的收尾步骤是否执行。
    # 正常情况下 opencode job 末尾的 Resume 步骤已完成恢复，这里的操作都是
    # 幂等的（重复启用无副作用，重复触发会被「已有排队/运行中 run」检查挡住）。
    needs: [opencode]
    if: always() && github.actor == '183600' && github.event.issue.user.login == '183600'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SUSPENDED_JSON: ${{ needs.opencode.outputs.suspended_workflows }}
    steps:
      - name: Ensure suspended workflows are re-enabled and retriggered
        shell: bash
        run: |
          set -uo pipefail

          # 与 opencode job 末尾的 Resume 步骤逻辑保持一致（幂等）。

          supports_dispatch() {
            local path="$1" content
            content="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${DEFAULT_BRANCH}" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)"
            [ -n "$content" ] && printf '%s' "$content" | grep -q 'workflow_dispatch'
          }

          has_recent_run() {
            local file="$1" n
            n="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${file}/runs?per_page=10" \
              --jq '[.workflow_runs[] | select(.status != "completed" or ((now - (.created_at | fromdateiso8601)) < 300))] | length' 2>/dev/null || true)"
            case "$n" in ''|*[!0-9]*) n=0 ;; esac
            [ "$n" -gt 0 ]
          }

          enable_workflow() {
            local id="$1" attempt
            for attempt in 1 2 3 4 5; do
              if gh workflow enable "$id" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                return 0
              fi
              echo "[ensure][warn] 启用 workflow ${id} 失败（attempt ${attempt}/5），10s 后重试" >&2
              sleep 10
            done
            return 1
          }

          trigger_workflow() {
            local file="$1" attempt
            for attempt in 1 2 3 4 5; do
              if gh workflow run "$file" --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" >/dev/null 2>&1; then
                return 0
              fi
              echo "[ensure][warn] 触发 ${file} 失败（attempt ${attempt}/5），10s 后重试" >&2
              sleep 10
            done
            return 1
          }

          TARGETS_TSV=""
          SUSPENDED_TRIMMED="$(printf '%s' "${SUSPENDED_JSON:-}" | tr -d '[:space:]')"
          if [ -n "$SUSPENDED_TRIMMED" ] && printf '%s' "${SUSPENDED_JSON:-}" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "[ensure] 使用 opencode job 记录的被暂停 workflow 清单"
            TARGETS_TSV="$(printf '%s' "${SUSPENDED_JSON}" | jq -r '.disabled[]? | [.id, .name, .path] | @tsv' 2>/dev/null || true)"
          else
            # 拿不到清单：opencode job 可能在 suspend 步骤中途被硬取消。
            # 扫描仓库中当前被禁用的 workflow 兜底恢复（排除本 workflow 自身）。
            echo "[ensure][warn] 没有被暂停清单（opencode job 可能在暂停步骤中途被取消），扫描仓库中被禁用的 workflow 兜底"
            TARGETS_TSV="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/workflows" \
              --jq '.workflows[] | select(.path | startswith(".github/workflows/")) | select(.path != ".github/workflows/opencode-issue.yml") | select(.state != "active") | [.id, .name, .path] | @tsv' 2>/dev/null || true)"
            if [ -n "$TARGETS_TSV" ]; then
              echo "[ensure][warn] 兜底扫描无法区分「本次运行禁用」与「此前手动禁用」的 workflow，以下将全部恢复："
              printf '%s\n' "$TARGETS_TSV" | awk -F '\t' '{print "  - " $2 " (" $3 ")"}'
            fi
          fi

          REENABLED=0
          ENABLE_FAILED=0
          TRIGGERED=0
          TRIGGER_FAILED=0
          TRIGGER_SKIPPED=0

          while IFS=$'\t' read -r id name path; do
            [ -n "$id" ] || continue
            file="${path##*/}"

            if enable_workflow "$id"; then
              REENABLED=$((REENABLED + 1))
              echo "[ensure] re-enabled ${name} (${path})"
            else
              ENABLE_FAILED=$((ENABLE_FAILED + 1))
              echo "[ensure][error] 启用 ${name} (${path}) 失败（已重试 5 次）" >&2
              continue
            fi

            if ! supports_dispatch "$path"; then
              echo "[ensure] ${name} 没有 workflow_dispatch 触发器，已重新启用，等待其自身事件/计划触发"
              TRIGGER_SKIPPED=$((TRIGGER_SKIPPED + 1))
              continue
            fi
            if has_recent_run "$file"; then
              echo "[ensure] ${name} 已有排队中/运行中/刚创建的 run，无需重复触发"
              TRIGGER_SKIPPED=$((TRIGGER_SKIPPED + 1))
              continue
            fi
            if trigger_workflow "$file"; then
              TRIGGERED=$((TRIGGERED + 1))
              echo "[ensure] re-triggered ${name} (${path}) on ${DEFAULT_BRANCH}"
            else
              TRIGGER_FAILED=$((TRIGGER_FAILED + 1))
              echo "[ensure][error] 触发 ${name} (${path}) 失败（已重试 5 次）" >&2
            fi
          done <<< "$TARGETS_TSV"

          echo "[ensure] done: reenabled=${REENABLED}, enable_failed=${ENABLE_FAILED}, triggered=${TRIGGERED}, trigger_failed=${TRIGGER_FAILED}, trigger_skipped=${TRIGGER_SKIPPED}"

          if [ "$ENABLE_FAILED" -ne 0 ] || [ "$TRIGGER_FAILED" -ne 0 ]; then
            exit 1
          fi
