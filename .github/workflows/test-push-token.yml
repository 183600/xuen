name: Test PUSH Token
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe PUSH_TOKEN
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PUSH_TOKEN:-}" ]; then
            echo "RESULT: PUSH_TOKEN is EMPTY"; exit 1
          fi
          echo "RESULT: PUSH_TOKEN length = ${#PUSH_TOKEN}"
          case "$PUSH_TOKEN" in
            ghp_*) echo "RESULT: classic PAT (ghp_ prefix)" ;;
            github_pat_*) echo "RESULT: fine-grained PAT (github_pat_ prefix)" ;;
            gho_*) echo "RESULT: OAuth token (gho_ prefix)" ;;
            ghs_*) echo "RESULT: App installation token (ghs_ prefix)" ;;
            *) echo "RESULT: unknown prefix: ${PUSH_TOKEN:0:4}***" ;;
          esac
          git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          echo "# probe $(date -u +%FT%TZ)" >> .github/workflows/test-push-token.yml
          git add -A && git commit -q -m "probe: push token test"
          if git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:probe-token-branch" 2>&1; then
            echo "RESULT: PUSH WORKS - token has workflow scope"
          else
            echo "RESULT: PUSH FAILED - token lacks workflow scope"
            exit 2
          fi
