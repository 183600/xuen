name: Continuous Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

# ⭐ 关键 1：同一时间只允许一个 run，新的排队等待（不取消旧的）。
#   每个 run 内含两个并行工作 job：run-xuen（设计一个新的算法）与
#   run-xuen-unibot（寻找参加 UniBot 的创新点），各自独立工作区/分支。
# 上一个 run 一结束，队列里的下一个立刻开始 → "上一个结束立刻触发下一个"
concurrency:
  group: continuous-loop
  cancel-in-progress: false

# ⭐ 关键 2：全局环境从源头防日志乱码
#   - LANG/LC_ALL=C.UTF-8        强制 UTF-8 locale，中文输出不会变问号/乱码
#   - NO_COLOR/FORCE_COLOR/TERM  让 opencode / npm / gh 等关闭颜色与 TUI 动画
#   - PYTHONIOENCODING/PYTHONUTF8  子进程里的 Python 一律 UTF-8
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  NO_COLOR: '1'
  FORCE_COLOR: '0'
  TERM: dumb
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  run-xuen:
    runs-on: ubuntu-latest
    # ⭐ 关键 3：硬超时 200 分钟（GitHub 单 job 上限 360 分钟）。
    # 前置安装 ~5 分钟 + 模型探测（最坏 ~16 分钟）+ xuen 工作窗口 165 分钟
    # + 工作区 checkpoint ~2 分钟 → 单次 job 约 3 小时。
    timeout-minutes: 200
    permissions:
      contents: write
      actions: write   # gh workflow run 需要

    steps:
      # ⭐ 立刻续跑（上）：本 run 一开始就把「下一个 run」排进 concurrency 队列。
      # concurrency.cancel-in-progress=false → 组内 1 running + 1 pending，
      # 本 run 无论以何种方式结束（成功 / 失败 / 超时被取消 / runner 宕机），
      # 队列里的后继 run 都会在几秒内自动开始；不依赖任何收尾步骤是否被执行。
      - name: Queue next run (immediate hand-off)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          # 组内是否已有「另一个」排队中的 run（排除当前 run 自己：
          # 它刚启动时 API 状态可能还是 pending，不能当成后继）
          pending_other() {
            gh api "repos/${GH_REPO}/actions/workflows/${WF_FILE}/runs?per_page=30" \
              --jq '[.workflow_runs[] | select((.id|tostring) != "'"${RUN_ID}"'") | select(.status=="pending" or .status=="queued" or .status=="waiting" or .status=="requested")] | length' \
              2>/dev/null
          }
          Q="$(pending_other)"
          # 查询失败时按 0 处理：宁可多派一个（会被队列合并），也绝不能漏派而断链
          case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
          echo "[loop] queued successors before dispatch: ${Q}"
          if [ "$Q" != "0" ]; then
            echo "[loop] 后继 run 已在队列中，无需重复派发"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              for _ in 1 2 3 4 5 6; do
                sleep 5
                Q="$(pending_other)"
                case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
                if [ "$Q" != "0" ]; then
                  echo "[loop] 后继 run 已排队（attempt ${attempt}）——当前 run 一结束它就会立刻起跑"
                  exit 0
                fi
              done
              echo "[loop][warn] 派发已提交但暂未看到排队的 run（attempt ${attempt}）"
            else
              echo "[loop][warn] 派发失败（attempt ${attempt}）"
            fi
            sleep 10
          done
          echo "[loop][warn] 未能确认后继 run；收尾的 next-run job 与 */15 心跳会补位"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python (pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install xuen dependencies
        run: |
          set -e
          python -m pip install --upgrade pip || echo "[warn] pip upgrade failed (non-fatal)"
          python -m pip install -r requirements.txt

      # npm 全局包缓存：直接缓存 ~/.npm（不依赖 lock 文件），`npm i -g` 会复用其中的 tarball。
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: ${{ runner.os }}-xuen-npm-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-xuen-npm-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install opencode
        run: |
          set +e
          npm i -g opencode-ai
          if command -v opencode >/dev/null 2>&1; then
            opencode --version
          else
            echo "[error] opencode 安装失败" >&2
            exit 1
          fi
      - name: Configure opencode permissions
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "*": "allow",
              "edit": {
                "*": "allow",
                ".github/**": "deny",
                "**/.github/**": "deny",
                "LICENSE": "deny",
                "**/LICENSE": "deny",
                "**/LICENSE.*": "deny"
              },
              "bash": {
                "*": "allow",
                "rm -rf .github*": "deny",
                "rm -r .github*": "deny",
                "rm .github*": "deny",
                "mv .github*": "deny",
                "git rm -r .github*": "deny",
                "rm *LICENSE*": "deny",
                "mv *LICENSE*": "deny",
                "cp *LICENSE*": "deny",
                "git rm *LICENSE*": "deny",
                "git push*": "deny"
              }
            },
            "model": "opencode/deepseek-v4.1-flash-free"
          }
          EOF

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 中文内容防乱码：提交一律 UTF-8，路径不做八进制转义显示
          git config i18n.commitEncoding utf-8
          git config core.quotepath false

      - name: Select harness (opencode only)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set +e
          # 一律使用 opencode 的 Zen 免费模型（不安装额外 harness、不读官方 key）
          SELECTED_MODEL=""
          SELECTED_VARIANT=""
          smoke() {
            local m="$1" v="$2" extra=""
            [ -n "$v" ] && extra="--variant $v"
            # shellcheck disable=SC2086
            timeout --kill-after=30 120 opencode run -m "$m" $extra "只回复两个字：OK" > /tmp/oc_smoke_test.log 2>&1
          }
          for spec in "opencode/deepseek-v4.1-flash-free|max"                       "opencode/deepseek-v4.1-flash-free|high"                       "opencode/deepseek-v4.1-flash-free|"                       "opencode/big-pickle|"; do
            [ -n "$SELECTED_MODEL" ] && break
            m="${spec%%|*}"; v="${spec#*|}"
            if smoke "$m" "$v"; then
              SELECTED_MODEL="$m"; SELECTED_VARIANT="$v"
            fi
          done
          if [ -z "$SELECTED_MODEL" ]; then
            SELECTED_MODEL="opencode/deepseek-v4.1-flash-free"
            echo "[warn] 冒烟测试未通过，仍按默认模型继续（xuen 内部会重试）"
          fi
          echo "[provider] 使用 $SELECTED_MODEL${SELECTED_VARIANT:+ (variant=$SELECTED_VARIANT)}"
          {
            echo "HARNESS=opencode"
            echo "MAIN_MODEL=$SELECTED_MODEL"
            echo "MAIN_VARIANT=$SELECTED_VARIANT"
            echo "JUDGE_MODEL=$SELECTED_MODEL"
            echo "JUDGE_VARIANT=$SELECTED_VARIANT"
            echo "XUEN_HARNESS=opencode"
            echo "XUEN_MODEL=$SELECTED_MODEL"
            echo "XUEN_VARIANT=$SELECTED_VARIANT"
            echo "XUEN_JUDGE_MODEL=$SELECTED_MODEL"
            echo "XUEN_JUDGE_VARIANT=$SELECTED_VARIANT"
          } >> "$GITHUB_ENV"

      - name: Restore workspace from xuen-loop branch
        run: |
          set -e
          if git ls-remote --exit-code --heads origin xuen-loop >/dev/null 2>&1; then
            git fetch origin xuen-loop --depth=1
            git checkout FETCH_HEAD -- workspace
            echo "[loop] 已从 xuen-loop 分支恢复工作区（上次的 research.md / words.txt / rounds/）"
            echo "--- workspace 概览 ---"
            ls -la workspace 2>/dev/null || true
            [ -f workspace/rounds/best.json ] \
              && cat workspace/rounds/best.json \
              || echo "[loop] 尚无最佳（首次运行）"
          else
            echo "[loop] xuen-loop 分支不存在：首次运行，从空工作区开始"
          fi

      - name: Write xuen config
        run: |
          set -e
          cat > /tmp/xuen_agent.sh <<'SHEOF'
          #!/usr/bin/env bash
          # xuen 的 agent 一律走 opencode（已移除额外 harness / DeepSeek 官方 API）
          role="${1:-main}"
          prompt="${2:-}"
          if [ "$role" = "judge" ]; then
            model="${XUEN_JUDGE_MODEL:-${XUEN_MODEL:-opencode/deepseek-v4.1-flash-free}}"
            variant="${XUEN_JUDGE_VARIANT:-}"
          else
            model="${XUEN_MODEL:-opencode/deepseek-v4.1-flash-free}"
            variant="${XUEN_VARIANT:-}"
          fi
          case "$model" in
            opencode/*) ;;
            *) model="opencode/deepseek-v4.1-flash-free"; variant="" ;;
          esac
          extra=""
          [ -n "$variant" ] && extra="--variant $variant"
          # shellcheck disable=SC2086
          exec opencode run -m "$model" $extra "$prompt"
          SHEOF
          chmod +x /tmp/xuen_agent.sh
          echo "[loop] MAIN=${XUEN_MODEL:-默认} JUDGE=${XUEN_JUDGE_MODEL:-默认}"

          cat > config.yaml <<'EOF'
          # 本文件由 CI 生成：xuen 研究循环配置（任务：设计一个新的算法）
          agent:
            command: '/tmp/xuen_agent.sh main "$prompt"'
            timeout: 1500

          extra_notes: |
            请像一位严谨的算法研究者一样思考；
            先给直觉与动机，再给严谨的形式化定义；
            产物区维护完整的算法设计（符号定义、算法步骤、复杂度分析、
            正确性论证与已知风险），每轮迭代在前人基础上改进而不是推倒重来；
            每轮结尾用一句话指出当前方案最大的风险。

          prompt:
            max_state_chars: 60000

          words:
            count: 300
            batch: 100
            pick: 3
            reuse: true

          loop:
            # ⭐ 单次调用约束：每个 job 只做一轮研究迭代
            # （一次主 agent 调用 + 一次轮次评审；评审属验证，不受单次调用限制）
            iterations: 1

          # 轮次守卫：每轮快照 → 候选 → AI 评审（便宜模型当评审员）→ 晋升/还原。
          # 没有测试套件可跑（研究型任务），verify=ai 直接走评审员；
          # 评审失败/解析不出分数的候选挂起，绝不丢快照。
          rounds:
            enabled: true
            dir: rounds
            verify: ai
            fallback: ai
            adopt_score: 7
            verify_timeout: 600
            repo: ""
            judge_command: '/tmp/xuen_agent.sh judge "$prompt"'
            judge_timeout: 600

          tui: false
          color: false
          workspace: ./workspace
          EOF

          echo "=== config.yaml ==="
          cat config.yaml

      # ⭐ 关键 4：xuen 研究循环（约 165 分钟工作窗口）。
      # 进度按轮保存：每轮结束 research.md / rounds/ 都已落盘；窗口到点发
      # SIGINT 让 xuen 优雅收尾（守卫汇总 + 兑现待决评分），即使被硬杀，
      # 下次启动时守卫也会把状态拨回当前最佳，绝不丢已验证的进展。
      - name: Run xuen loop (~3h window)
        timeout-minutes: 175
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set +e
          WORK_SECONDS=9900        # 工作窗口：165 分钟

          # ⭐ 远端同步：后继 run 在本 run 开始时派发的，workflow_dispatch 在事件创建时解析
          # ref → SHA，排队中的 run 其 checkout 可能停在旧 commit；这里强制对齐远端最新提交。
          BRANCH_SYNC="${GITHUB_REF_NAME:-master}"
          git fetch origin "$BRANCH_SYNC" --prune >/dev/null 2>&1 || true
          if git rev-parse --verify -q "origin/${BRANCH_SYNC}" >/dev/null 2>&1; then
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${BRANCH_SYNC}")" ]; then
              echo "[sync] 工作区落后于 origin/${BRANCH_SYNC}，重置到最新提交"
              git reset --hard "origin/${BRANCH_SYNC}" >/dev/null 2>&1 || true
            fi
          fi

          # ⭐ 单次调用约束：本 job 只做一次 opencode 工作调用。
          # 掷骰子决定本 job 的唯一任务：1/10 概率做「优化代码和文档」，否则做一轮 xuen
          # 研究迭代（iterations:1）；两者互斥，绝不在同一 job 内出现两次工作调用。
          DOCS_THIS_RUN=$(( RANDOM % 10 ))
          if [ "$DOCS_THIS_RUN" -eq 0 ]; then
            echo "[job-plan] 本 job 轮到 docs 优化（1/10 命中）——跳过 xuen 研究窗口，由后续 docs 步骤执行"
            echo "XUEN_DOCS_ONLY=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "[job-plan] 本 job 执行一轮 xuen 研究迭代（docs 未命中）"
          # ⭐ 前置测试门：本窗口内 xuen 会反复调用 opencode（agent.command）；
          # 窗口启动前先跑一遍本仓库测试（python -m pytest -q，与 ci.yml 一致）。
          # 失败 → 推送当前状态并以 exit 86 提前结束本 job；后继 run 已在队列中，数秒内自动接续。
          cat > /tmp/pretest_run.sh <<'PTGEOF'
          set +e
          [ -f pyproject.toml ] || exit 42
          python3 -m pip install --quiet -r requirements-ci.txt >/dev/null 2>&1 || exit 43
          python3 -m pytest -q
          exit $?
          PTGEOF
          echo "=========== PRE-OPENCODE TEST GATE ==========="
          PTEC=0
          timeout --kill-after=60 1500 bash /tmp/pretest_run.sh > /tmp/pretest_gate.log 2>&1 || PTEC=$?
          tail -25 /tmp/pretest_gate.log 2>/dev/null || true
          case "$PTEC" in
            0|42|43|124|137|143)
              echo "[pre-test] exit=$PTEC（通过/无可识别测试/依赖不可用/超时），放行" ;;
            *)
              echo "[pre-test] 测试失败(exit=$PTEC) → 推送当前状态并提前结束本 job"
              git add -A
              git commit -m "auto: pre-opencode test gate failed (exit=$PTEC)" \
                || echo "[pre-test] 没有新内容可提交"
              BRANCH_PT="${GITHUB_REF_NAME:-master}"
              git pull --rebase origin "$BRANCH_PT" 2>/dev/null || git rebase --abort 2>/dev/null || true
              git push origin "HEAD:$BRANCH_PT" \
                || echo "[pre-test] [warn] push 失败"
              exit 86 ;;
          esac

          echo "[loop] 任务：设计一个新的算法｜窗口 ${WORK_SECONDS}s｜模型：${MAIN_MODEL:-默认}"
          timeout --signal=INT --kill-after=60s "$WORK_SECONDS" \
            python3 main.py --no-tui --no-color "设计一个新的算法" -c config.yaml
          RC=$?
          case "$RC" in
            0)   echo "[loop] xuen 正常结束（进度已按轮持久化）" ;;
            124|137|143)
                 echo "[loop] 工作窗口到点，xuen 被截断（退出码 $RC；每轮进度已落盘）" ;;
            130) echo "[loop] xuen 收到中断信号，已优雅收尾（进度已持久化）" ;;
            *)   echo "::warning::xuen 退出码 $RC（进度不丢；下个 run 自动从最佳继续）" ;;
          esac
          exit 0

      # ⭐ 进度保存（跨 run）：把工作区 checkpoint 到专用 xuen-loop 分支。
      # 用 plumbing 提交（commit-tree + push），完全不动本地 master 分支：
      # master 保持干净（workspace 被 .gitignore 覆盖，仓库卫生测试不受影响），
      # xuen-loop 分支 = 最新代码快照 + 工作区进度，下次 run 开头恢复。
      - name: Checkpoint workspace to xuen-loop
        if: ${{ !cancelled() }}
        run: |
          set -e
          # docs-only 的 job 没有跑 xuen 研究窗口，工作区无新进度，跳过 checkpoint
          if [ "${XUEN_DOCS_ONLY:-0}" = "1" ]; then
            echo "[checkpoint] 本 job 为 docs-only，跳过 xuen-loop checkpoint"
            exit 0
          fi
          # 防御：外部 agent 若动过 .github / 遗留临时清单，先恢复原状
          git checkout HEAD -- .github 2>/dev/null || true
          git clean -fdq .github 2>/dev/null || true
          rm -f .opencode_issues.md
          if [ ! -d workspace ]; then
            echo "[loop] 工作区不存在（本轮未产生任何进度），跳过 checkpoint"
            exit 0
          fi
          git add -f workspace
          if git rev-parse --verify -q origin/xuen-loop >/dev/null; then
            PARENT="$(git rev-parse origin/xuen-loop)"
          else
            PARENT="$(git rev-parse HEAD)"
          fi
          TREE="$(git write-tree)"
          COMMIT="$(git commit-tree "$TREE" -p "$PARENT" \
            -m "chore(xuen): workspace checkpoint (run ${GITHUB_RUN_ID})")"
          git push origin "$COMMIT:refs/heads/xuen-loop"
          git reset -q   # 只清索引，工作区文件保留
          echo "[loop] 工作区已 checkpoint 到 xuen-loop 分支：${COMMIT:0:12}"

      # ⭐ 新增：「优化代码和文档」步骤（每次循环 1/10 概率执行）。
      #   本 workflow 的「循环」= 持续自续跑的每个 run；每个 run 掷一次骰子，
      #   1/10 概率命中才调用 opencode 优化本仓库自身的代码与文档。
      #   放在 workspace checkpoint 之后执行：即使本步骤被 job 硬超时截断，
      #   工作区进度也已先落盘，不会影响研究循环的连续性。
      - name: Optimize repo code & docs (1/10 chance)
        if: ${{ !cancelled() }}
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set +e
          # ⭐ 单次调用约束：docs 与 xuen 研究迭代互斥（决策在「Run xuen loop」步骤开头）
          if [ "${XUEN_DOCS_ONLY:-0}" != "1" ]; then
            echo "[docs] 本 job 已执行 xuen 研究迭代（单次调用约束），docs 跳过"
            exit 0
          fi
          echo "[docs] 本 job 轮到 docs 优化（1/10 命中），执行代码与文档优化"
          PROMPT_DOCS='优化 xuen（随机灵感词 × 外部 agent 研究循环）项目的代码和文档。代码方面：只做不改变功能语义的重构（命名、注释、消除重复、结构清晰），保持模块接口、TUI 行为与配置格式完全不变。文档方面：改进 README.md 与 config.example.yaml 注释的表述、结构与示例，让说明更准确易读；可以修改内容，但不得删除或移动文件，也不得添加关于修复了哪些bug、优化或改进了哪些内容的记录。改动后若依赖可用则运行 python -m pytest -q 自检，不通过就自己修好。不要输出或写入“优化了哪些内容”的报告。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README.md、main.py、pyproject.toml 与 tests/ 同样绝对不能删除或移动。'
          MODEL="${XUEN_MODEL:-opencode/deepseek-v4.1-flash-free}"
          VARIANT="${XUEN_VARIANT:-}"
          EXTRA=""
          [ -n "$VARIANT" ] && EXTRA="--variant $VARIANT"
          # ⭐ 前置测试门：opencode 调用前先跑一遍本仓库测试（python -m pytest -q）。
          # 失败 → 推送当前状态并以 exit 86 提前结束本 job；后继 run 已在队列中，数秒内自动接续。
          cat > /tmp/pretest_run.sh <<'PTGEOF'
          set +e
          [ -f pyproject.toml ] || exit 42
          python3 -m pip install --quiet -r requirements-ci.txt >/dev/null 2>&1 || exit 43
          python3 -m pytest -q
          exit $?
          PTGEOF
          echo "=========== PRE-OPENCODE TEST GATE (docs) ==========="
          PTEC=0
          timeout --kill-after=60 1500 bash /tmp/pretest_run.sh > /tmp/pretest_gate.log 2>&1 || PTEC=$?
          tail -25 /tmp/pretest_gate.log 2>/dev/null || true
          case "$PTEC" in
            0|42|43|124|137|143)
              echo "[pre-test] exit=$PTEC（通过/无可识别测试/依赖不可用/超时），放行" ;;
            *)
              echo "[pre-test] 测试失败(exit=$PTEC) → 推送当前状态并提前结束本 job"
              git add -A
              git commit -m "auto: pre-opencode test gate failed (docs, exit=$PTEC)" \
                || echo "[pre-test] 没有新内容可提交"
              BRANCH_PT="${GITHUB_REF_NAME:-master}"
              git pull --rebase origin "$BRANCH_PT" 2>/dev/null || git rebase --abort 2>/dev/null || true
              git push origin "HEAD:$BRANCH_PT" \
                || echo "[pre-test] [warn] push 失败"
              exit 86 ;;
          esac

          # shellcheck disable=SC2086
          timeout --kill-after=60 480 opencode run -m "$MODEL" $EXTRA "$PROMPT_DOCS" 2>&1 | tee /tmp/oc_docs_opt.log
          RC=${PIPESTATUS[0]}
          case "$RC" in
            0)           echo "[docs] 优化调用完成" ;;
            124|137|143) echo "[docs] 超时/被杀（exit=$RC），已完成的改动仍会提交" ;;
            *)           echo "[warn][docs] 调用失败（exit=$RC），仍尝试提交已完成改动" ;;
          esac
          # 防御性恢复 .github，然后沿用既有提交路径提交推送
          git checkout HEAD -- .github 2>/dev/null || true
          git clean -fdq .github 2>/dev/null || true
          rm -f .opencode_issues.md
          git add -A || true
          if git diff --cached --quiet; then
            echo "[docs] 没有可提交的改动"
            exit 0
          fi
          git commit -m "auto: docs & code polish (1/10 roll hit)" || true
          BRANCH="${GITHUB_REF_NAME:-master}"
          git pull --rebase origin "$BRANCH" || git rebase --abort || true
          git push origin "HEAD:${BRANCH}" || echo "[warn][docs] push 失败（下轮会继续）"
          exit 0

      - name: Push to Gitee
        if: ${{ !cancelled() }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPO" ]; then
            echo "GITEE_TOKEN or GITEE_REPO not set, skipping Gitee push."
            exit 0
          fi
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git push gitee "HEAD:${GITHUB_REF_NAME}" || echo "[warn] push to Gitee failed"

  # ⭐ 并行任务 2：UniBot 参赛创新点研究（与 run-xuen 在同一 run 内并行执行）。
  # 独立 runner、独立工作区分支（xuen-loop-unibot）；与主任务同样使用
  # opencode harness（内置 websearch / webfetch 联网工具，实测免费可用），
  # 队列派发仍由 run-xuen 开头的步骤 + 收尾 next-run job 负责（next-run 已
  # needs 两个工作 job，两个任务都收尾后才派发后继 run）。
  run-xuen-unibot:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python (pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install xuen dependencies
        run: |
          set -e
          python -m pip install --upgrade pip || echo "[warn] pip upgrade failed (non-fatal)"
          python -m pip install -r requirements.txt

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: ${{ runner.os }}-xuen-npm-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-xuen-npm-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install opencode
        run: |
          set -e
          npm i -g opencode-ai
          if ! command -v opencode >/dev/null 2>&1; then
            echo "[error] opencode 安装失败" >&2
            exit 1
          fi
          opencode --version

      - name: Configure opencode permissions
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "*": "allow",
              "edit": {
                "*": "allow",
                ".github/**": "deny",
                "**/.github/**": "deny",
                "LICENSE": "deny",
                "**/LICENSE": "deny",
                "**/LICENSE.*": "deny"
              },
              "bash": {
                "*": "allow",
                "rm -rf .github*": "deny",
                "rm -r .github*": "deny",
                "rm .github*": "deny",
                "mv .github*": "deny",
                "git rm -r .github*": "deny",
                "rm *LICENSE*": "deny",
                "mv *LICENSE*": "deny",
                "cp *LICENSE*": "deny",
                "git rm *LICENSE*": "deny",
                "git push*": "deny"
              }
            },
            "model": "opencode/deepseek-v4.1-flash-free"
          }
          EOF

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config i18n.commitEncoding utf-8
          git config core.quotepath false

      - name: Select model (opencode, websearch-capable)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set +e
          # UniBot 调研依赖联网搜索：与主任务一致，一律使用 opencode Zen 免费模型
          SELECTED_MODEL=""
          SELECTED_VARIANT=""
          smoke() {
            local m="$1" v="$2" extra=""
            [ -n "$v" ] && extra="--variant $v"
            # shellcheck disable=SC2086
            timeout --kill-after=30 120 opencode run -m "$m" $extra "只回复两个字：OK" > /tmp/oc_smoke_unibot.log 2>&1
          }
          for spec in "opencode/deepseek-v4.1-flash-free|max"                       "opencode/deepseek-v4.1-flash-free|high"                       "opencode/deepseek-v4.1-flash-free|"                       "opencode/big-pickle|"; do
            [ -n "$SELECTED_MODEL" ] && break
            m="${spec%%|*}"; v="${spec#*|}"
            if smoke "$m" "$v"; then
              SELECTED_MODEL="$m"; SELECTED_VARIANT="$v"
            fi
          done
          if [ -z "$SELECTED_MODEL" ]; then
            SELECTED_MODEL="opencode/deepseek-v4.1-flash-free"
            echo "[unibot][warn] 冒烟测试未通过，仍按默认模型继续（xuen 内部会重试）"
          fi
          echo "[unibot][provider] 使用 $SELECTED_MODEL${SELECTED_VARIANT:+ (variant=$SELECTED_VARIANT)}"
          {
            echo "HARNESS=opencode"
            echo "MAIN_MODEL=$SELECTED_MODEL"
            echo "MAIN_VARIANT=$SELECTED_VARIANT"
            echo "JUDGE_MODEL=$SELECTED_MODEL"
            echo "JUDGE_VARIANT=$SELECTED_VARIANT"
            echo "XUEN_HARNESS=opencode"
            echo "XUEN_MODEL=$SELECTED_MODEL"
            echo "XUEN_VARIANT=$SELECTED_VARIANT"
            echo "XUEN_JUDGE_MODEL=$SELECTED_MODEL"
            echo "XUEN_JUDGE_VARIANT=$SELECTED_VARIANT"
          } >> "$GITHUB_ENV"

      - name: Restore workspace from xuen-loop-unibot branch
        run: |
          set -e
          if git ls-remote --exit-code --heads origin xuen-loop-unibot >/dev/null 2>&1; then
            git fetch origin xuen-loop-unibot --depth=1
            git checkout FETCH_HEAD -- workspace
            echo "[unibot] 已从 xuen-loop-unibot 分支恢复工作区（上次的 research.md / words.txt / rounds/）"
            ls -la workspace 2>/dev/null || true
            [ -f workspace/rounds/best.json ] \
              && cat workspace/rounds/best.json \
              || echo "[unibot] 尚无最佳（首次运行）"
          else
            echo "[unibot] xuen-loop-unibot 分支不存在：首次运行，从空工作区开始"
          fi

      - name: Write xuen config
        run: |
          set -e
          cat > /tmp/xuen_agent.sh <<'SHEOF'
          #!/usr/bin/env bash
          # xuen 的 agent 一律走 opencode（与主任务一致，含模型名防护）
          role="${1:-main}"
          prompt="${2:-}"
          if [ "$role" = "judge" ]; then
            model="${XUEN_JUDGE_MODEL:-${XUEN_MODEL:-opencode/deepseek-v4.1-flash-free}}"
            variant="${XUEN_JUDGE_VARIANT:-}"
          else
            model="${XUEN_MODEL:-opencode/deepseek-v4.1-flash-free}"
            variant="${XUEN_VARIANT:-}"
          fi
          case "$model" in
            opencode/*) ;;
            *) model="opencode/deepseek-v4.1-flash-free"; variant="" ;;
          esac
          extra=""
          [ -n "$variant" ] && extra="--variant $variant"
          # shellcheck disable=SC2086
          exec opencode run -m "$model" $extra "$prompt"
          SHEOF
          chmod +x /tmp/xuen_agent.sh
          echo "[unibot] MAIN=${XUEN_MODEL:-默认} JUDGE=${XUEN_JUDGE_MODEL:-默认}"

          cat > config.yaml <<'EOF'
          # 本文件由 CI 生成：xuen 研究循环配置（任务：寻找参加 UniBot 的创新点）
          agent:
            command: '/tmp/xuen_agent.sh main "$prompt"'
            timeout: 1800

          extra_notes: |
            请像一位严谨的参赛策略研究员一样思考；
            你拥有联网工具（websearch 网页搜索、webfetch 抓取网页、bash 里可用 curl），
            请主动使用它们获取真实信息，不要只凭记忆作答；
            UniBot 优先按「宇树科技 UniBot 世界挑战赛」（unibot.unitree.com）理解：
            基于 Unitree G1 人形机器人平台的具身智能泛化操作评测——32 项桌面任务
            （抓取/放置/双手协调）、5 类泛化场景（位置/干扰物/背景/未见物品/人为干扰）、
            通才模型赛道（单模型完成全部任务，按平均成功率与步骤分排名）、
            选手自行部署模型并以标准化 API 远程接入；
            每轮先搜索核实赛事最新信息（规则、任务清单、排行榜、数据集
            HuggingFace unitreerobotics/unibot-v1-challenge、github
            unitreerobotics/unibot_submission），再推进研究；
            重点分析榜单头部方案的做法与瓶颈（榜首成功率也不到 30%），
            思考在数据、模型架构（VLA / World Model / 混合）、训练策略、
            接口工程等维度上可能的创新切入点；
            若搜索发现用户所指更可能是其他 UniBot，请先说明再按最可能的展开；
            产物区维护一份持续迭代的创新点清单：每个点包含动机、与现有方案的差异、
            技术可行性、所需资源（数据/算力/接口）、落地步骤与风险；
            每轮迭代优先深化与修剪清单，而不是推倒重来；
            所有外部信息注明来源链接与检索日期；
            每轮结尾用一句话指出当前最值得押注的创新点。

          prompt:
            max_state_chars: 60000

          words:
            count: 300
            batch: 100
            pick: 3
            reuse: true

          loop:
            # ⭐ 单次调用约束：每个 job 只做一轮研究迭代
            # （一次主 agent 调用 + 一次轮次评审；评审属验证，不受单次调用限制）
            iterations: 1

          rounds:
            enabled: true
            dir: rounds
            verify: ai
            fallback: ai
            adopt_score: 7
            verify_timeout: 600
            repo: ""
            judge_command: '/tmp/xuen_agent.sh judge "$prompt"'
            judge_timeout: 600

          tui: false
          color: false
          workspace: ./workspace
          EOF

          echo "=== config.yaml (unibot) ==="
          cat config.yaml

      - name: Run xuen loop (unibot, ~3h window)
        timeout-minutes: 175
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set +e
          WORK_SECONDS=9900        # 工作窗口：165 分钟

          # ⭐ 远端同步：后继 run 在本 run 开始时派发的，workflow_dispatch 在事件创建时解析
          # ref → SHA，排队中的 run 其 checkout 可能停在旧 commit；这里强制对齐远端最新提交。
          BRANCH_SYNC="${GITHUB_REF_NAME:-master}"
          git fetch origin "$BRANCH_SYNC" --prune >/dev/null 2>&1 || true
          if git rev-parse --verify -q "origin/${BRANCH_SYNC}" >/dev/null 2>&1; then
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${BRANCH_SYNC}")" ]; then
              echo "[sync] 工作区落后于 origin/${BRANCH_SYNC}，重置到最新提交"
              git reset --hard "origin/${BRANCH_SYNC}" >/dev/null 2>&1 || true
            fi
          fi
          # ⭐ 前置测试门：本窗口内 xuen 会反复调用 opencode（agent.command）；
          # 窗口启动前先跑一遍本仓库测试（python -m pytest -q，与 ci.yml 一致）。
          # 失败 → 推送当前状态并以 exit 86 提前结束本 job；后继 run 已在队列中，数秒内自动接续。
          cat > /tmp/pretest_run.sh <<'PTGEOF'
          set +e
          [ -f pyproject.toml ] || exit 42
          python3 -m pip install --quiet -r requirements-ci.txt >/dev/null 2>&1 || exit 43
          python3 -m pytest -q
          exit $?
          PTGEOF
          echo "=========== PRE-OPENCODE TEST GATE ==========="
          PTEC=0
          timeout --kill-after=60 1500 bash /tmp/pretest_run.sh > /tmp/pretest_gate.log 2>&1 || PTEC=$?
          tail -25 /tmp/pretest_gate.log 2>/dev/null || true
          case "$PTEC" in
            0|42|43|124|137|143)
              echo "[pre-test] exit=$PTEC（通过/无可识别测试/依赖不可用/超时），放行" ;;
            *)
              echo "[pre-test] 测试失败(exit=$PTEC) → 推送当前状态并提前结束本 job"
              git add -A
              git commit -m "auto: pre-opencode test gate failed (exit=$PTEC)" \
                || echo "[pre-test] 没有新内容可提交"
              BRANCH_PT="${GITHUB_REF_NAME:-master}"
              git pull --rebase origin "$BRANCH_PT" 2>/dev/null || git rebase --abort 2>/dev/null || true
              git push origin "HEAD:$BRANCH_PT" \
                || echo "[pre-test] [warn] push 失败"
              exit 86 ;;
          esac

          echo "[unibot] 任务：寻找参加UniBot的创新点｜窗口 ${WORK_SECONDS}s｜模型：${MAIN_MODEL:-默认}"
          timeout --signal=INT --kill-after=60s "$WORK_SECONDS" \
            python3 main.py --no-tui --no-color "寻找参加UniBot的创新点" -c config.yaml
          RC=$?
          case "$RC" in
            0)   echo "[unibot] xuen 正常结束（进度已按轮持久化）" ;;
            124|137|143)
                 echo "[unibot] 工作窗口到点，xuen 被截断（退出码 $RC；每轮进度已落盘）" ;;
            130) echo "[unibot] xuen 收到中断信号，已优雅收尾（进度已持久化）" ;;
            *)   echo "::warning::[unibot] xuen 退出码 $RC（进度不丢；下个 run 自动从最佳继续）" ;;
          esac
          exit 0

      - name: Checkpoint workspace to xuen-loop-unibot
        if: ${{ !cancelled() }}
        run: |
          set -e
          # 防御：外部 agent 若动过 .github / 遗留临时清单，先恢复原状
          git checkout HEAD -- .github 2>/dev/null || true
          git clean -fdq .github 2>/dev/null || true
          rm -f .opencode_issues.md
          if [ ! -d workspace ]; then
            echo "[unibot] 工作区不存在（本轮未产生任何进度），跳过 checkpoint"
            exit 0
          fi
          find workspace -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
          git add -f workspace
          if git rev-parse --verify -q origin/xuen-loop-unibot >/dev/null; then
            PARENT="$(git rev-parse origin/xuen-loop-unibot)"
          else
            PARENT="$(git rev-parse HEAD)"
          fi
          TREE="$(git write-tree)"
          COMMIT="$(git commit-tree "$TREE" -p "$PARENT" \
            -m "chore(xuen-unibot): workspace checkpoint (run ${GITHUB_RUN_ID})")"
          git push origin "$COMMIT:refs/heads/xuen-loop-unibot"
          git reset -q   # 只清索引，工作区文件保留
          echo "[unibot] 工作区已 checkpoint 到 xuen-loop-unibot 分支：${COMMIT:0:12}"

  # ⭐ 立刻续跑（下）：独立的收尾 job。
  # needs + if: always()：两个工作 job（run-xuen 算法设计 + run-xuen-unibot
  # UniBot 调研）无论成功、失败、超时被取消，这个 job 都会在它们全部收尾后
  # 紧接着启动。这里无条件派发一个新的后继 run：它在组内排队，本 run 退出
  # 的一瞬间就被调度。万一这个 job 连启动都没机会（整个 run 被强杀），
  # */15 心跳会兜底。
  next-run:
    needs: [run-xuen, run-xuen-unibot]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Ensure next run is queued
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              echo "[loop] 已派发后继 run（attempt ${attempt}）——本 run 结束后立刻起跑"
              exit 0
            fi
            echo "[loop][warn] 派发失败（attempt ${attempt}）10s 后重试"
            sleep 10
          done
          echo "[loop][warn] 派发失败；下一次 */15 心跳会补位"
          exit 0
