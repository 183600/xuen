name: Continuous Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

# ⭐ 关键 1：同一时间只允许一个 run，新的排队等待（不取消旧的）
# 上一个 run 一结束，队列里的下一个立刻开始 → "上一个结束立刻触发下一个"
concurrency:
  group: continuous-loop
  cancel-in-progress: false

# ⭐ 关键 2：全局环境从源头防日志乱码
#   - LANG/LC_ALL=C.UTF-8        强制 UTF-8 locale，中文输出不会变问号/乱码
#   - NO_COLOR/FORCE_COLOR/TERM  让 opencode / npm / gh 等关闭颜色与 TUI 动画
#   - PYTHONIOENCODING/PYTHONUTF8  子进程里的 Python 一律 UTF-8
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  NO_COLOR: '1'
  FORCE_COLOR: '0'
  TERM: dumb
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  run-xuen:
    runs-on: ubuntu-latest
    # ⭐ 关键 3：硬超时 200 分钟（GitHub 单 job 上限 360 分钟）。
    # 前置安装 ~5 分钟 + 模型探测（最坏 ~16 分钟）+ xuen 工作窗口 165 分钟
    # + 工作区 checkpoint ~2 分钟 → 单次 job 约 3 小时。
    timeout-minutes: 200
    permissions:
      contents: write
      actions: write   # gh workflow run 需要

    steps:
      # ⭐ 立刻续跑（上）：本 run 一开始就把「下一个 run」排进 concurrency 队列。
      # concurrency.cancel-in-progress=false → 组内 1 running + 1 pending，
      # 本 run 无论以何种方式结束（成功 / 失败 / 超时被取消 / runner 宕机），
      # 队列里的后继 run 都会在几秒内自动开始；不依赖任何收尾步骤是否被执行。
      - name: Queue next run (immediate hand-off)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          # 组内是否已有「另一个」排队中的 run（排除当前 run 自己：
          # 它刚启动时 API 状态可能还是 pending，不能当成后继）
          pending_other() {
            gh api "repos/${GH_REPO}/actions/workflows/${WF_FILE}/runs?per_page=30" \
              --jq '[.workflow_runs[] | select((.id|tostring) != "'"${RUN_ID}"'") | select(.status=="pending" or .status=="queued" or .status=="waiting" or .status=="requested")] | length' \
              2>/dev/null
          }
          Q="$(pending_other)"
          # 查询失败时按 0 处理：宁可多派一个（会被队列合并），也绝不能漏派而断链
          case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
          echo "[loop] queued successors before dispatch: ${Q}"
          if [ "$Q" != "0" ]; then
            echo "[loop] 后继 run 已在队列中，无需重复派发"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              for _ in 1 2 3 4 5 6; do
                sleep 5
                Q="$(pending_other)"
                case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
                if [ "$Q" != "0" ]; then
                  echo "[loop] 后继 run 已排队（attempt ${attempt}）——当前 run 一结束它就会立刻起跑"
                  exit 0
                fi
              done
              echo "[loop][warn] 派发已提交但暂未看到排队的 run（attempt ${attempt}）"
            else
              echo "[loop][warn] 派发失败（attempt ${attempt}）"
            fi
            sleep 10
          done
          echo "[loop][warn] 未能确认后继 run；收尾的 next-run job 与 */15 心跳会补位"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python (pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install xuen dependencies
        run: |
          set -e
          python -m pip install --upgrade pip || echo "[warn] pip upgrade failed (non-fatal)"
          python -m pip install -r requirements.txt

      # npm 全局包缓存：直接缓存 ~/.npm（不依赖 lock 文件），`npm i -g` 会复用其中的 tarball。
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: ${{ runner.os }}-xuen-npm-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-xuen-npm-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install AI harnesses (dsh primary, opencode fallback)
        run: |
          set +e
          npm i -g @deepseek-ai/dsh@0.2.1-rc.2
          if command -v dsh >/dev/null 2>&1; then
            dsh --version
          else
            echo "[warn] dsh 安装失败，将使用 opencode 兜底"
          fi
          npm i -g opencode-ai
          if command -v opencode >/dev/null 2>&1; then
            opencode --version
          else
            echo "[warn] opencode 安装失败"
          fi
          if ! command -v dsh >/dev/null 2>&1 && ! command -v opencode >/dev/null 2>&1; then
            echo "[error] dsh 与 opencode 均不可用" >&2
            exit 1
          fi

      - name: Configure AI harnesses (dsh primary, opencode fallback)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          mkdir -p ~/.config/opencode
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "[info] DEEPSEEK_API_KEY 已配置（dsh 使用）"
          else
            echo "[warn] DEEPSEEK_API_KEY 未配置：dsh 不可用，将走 opencode 免费模型"
          fi
          if command -v dsh >/dev/null 2>&1; then
            echo "[info] dsh $(dsh --version) | provider=deepseek-official | model=deepseek-flash"
          fi
          if command -v opencode >/dev/null 2>&1; then
            echo "[info] opencode $(opencode --version) | fallback ready"
          fi

      - name: Configure opencode permissions (fallback)
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "*": "allow",
              "edit": {
                "*": "allow",
                ".github/**": "deny",
                "**/.github/**": "deny",
                "LICENSE": "deny",
                "**/LICENSE": "deny",
                "**/LICENSE.*": "deny"
              },
              "bash": {
                "*": "allow",
                "rm -rf .github*": "deny",
                "rm -r .github*": "deny",
                "rm .github*": "deny",
                "mv .github*": "deny",
                "git rm -r .github*": "deny",
                "rm *LICENSE*": "deny",
                "mv *LICENSE*": "deny",
                "cp *LICENSE*": "deny",
                "git rm *LICENSE*": "deny",
                "git push*": "deny"
              }
            },
            "model": "opencode/deepseek-v4.1-flash-free"
          }
          EOF

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 中文内容防乱码：提交一律 UTF-8，路径不做八进制转义显示
          git config i18n.commitEncoding utf-8
          git config core.quotepath false

      # ================= harness：dsh 主用，opencode 兜底 =================
      # 首选 DeepSeek Harness；dsh 无法安装/执行/冒烟失败时，自动改用
      # opencode（调用方式与 2026-10-22 备份中的 `opencode run -m ...` 一致）。
      - name: Select harness (dsh primary, opencode fallback)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set +e
          # ================= harness: dsh 主用，opencode 兜底 =================
          # 首选 DeepSeek Harness（dsh + DeepSeek 官方 API）；当 dsh 无法安装、
          # 无法执行、启动冒烟失败或阶段调用失败时，自动切换到 opencode。
          # opencode 的调用方式与 2026-10-22 备份中的旧 workflow 完全一致：
          #     opencode run -m "$SELECTED_MODEL" [--variant ...] "$prompt"
          DSH_MODEL="deepseek-official/deepseek-flash"
          HARNESS=""
          SELECTED_MODEL=""
          SELECTED_PROVIDER=""
          SELECTED_VARIANT=""
          CURRENT_MODEL=""
          CURRENT_PROVIDER=""
          OC_BROKEN=""

          oc_mark_broken() {
            [ -n "$1" ] || return 0
            case ",$OC_BROKEN," in *",$1,"*) ;; *) OC_BROKEN="$OC_BROKEN${OC_BROKEN:+,}$1" ;; esac
          }
          oc_is_broken() {
            case ",$OC_BROKEN," in *",$1,"*) return 0 ;; *) return 1 ;; esac
          }

          opencode_smoke() {
            local m="$1" v="$2" extra=""
            [ -n "$v" ] && extra="--variant $v"
            # shellcheck disable=SC2086
            timeout --kill-after=30 120 opencode run -m "$m" $extra "只回复两个字：OK" > /tmp/oc_smoke_test.log 2>&1
          }

          opencode_detect() {
            local cand v
            # 与备份一致：优先 DeepSeek 官方 API（若该仓库原本支持），
            # 然后走 opencode Zen 免费池 deepseek-v4.1-flash-free → big-pickle。
            if declare -F probe_deepseek >/dev/null 2>&1 \
               && declare -F switch_provider >/dev/null 2>&1 \
               && [ -n "${DEEPSEEK_API_KEY:-}" ]; then
              if probe_deepseek; then
                switch_provider deepseek
                if opencode_smoke "deepseek/$DEEPSEEK_MODEL" ""; then
                  SELECTED_MODEL="deepseek/$DEEPSEEK_MODEL"
                  SELECTED_PROVIDER="deepseek"
                  SELECTED_VARIANT=""
                  CURRENT_MODEL="$SELECTED_MODEL"
                  CURRENT_PROVIDER="$SELECTED_PROVIDER"
                  export SELECTED_MODEL SELECTED_PROVIDER SELECTED_VARIANT
                  echo "[provider] opencode 兜底选定 $SELECTED_MODEL（DeepSeek 官方 API）"
                  return 0
                fi
              fi
            fi
            for cand in opencode/deepseek-v4.1-flash-free opencode/big-pickle; do
              oc_is_broken "$cand" && continue
              if [ "$cand" = "opencode/big-pickle" ]; then
                if opencode_smoke "$cand" ""; then
                  SELECTED_MODEL="$cand"
                  SELECTED_PROVIDER="$cand"
                  SELECTED_VARIANT=""
                  CURRENT_MODEL="$SELECTED_MODEL"
                  CURRENT_PROVIDER="$SELECTED_PROVIDER"
                  export SELECTED_MODEL SELECTED_PROVIDER SELECTED_VARIANT
                  echo "[provider] opencode 兜底选定 $cand"
                  return 0
                fi
              else
                for v in max high ""; do
                  if opencode_smoke "$cand" "$v"; then
                    SELECTED_MODEL="$cand"
                    SELECTED_PROVIDER="$cand"
                    SELECTED_VARIANT="$v"
                    CURRENT_MODEL="$SELECTED_MODEL"
                    CURRENT_PROVIDER="$SELECTED_PROVIDER"
                    export SELECTED_MODEL SELECTED_PROVIDER SELECTED_VARIANT
                    echo "[provider] opencode 兜底选定 $cand${v:+ (variant=$v)}"
                    return 0
                  fi
                done
              fi
              oc_mark_broken "$cand"
            done
            SELECTED_MODEL=""
            SELECTED_PROVIDER=""
            SELECTED_VARIANT=""
            CURRENT_MODEL=""
            CURRENT_PROVIDER=""
            export SELECTED_MODEL SELECTED_PROVIDER SELECTED_VARIANT
            return 1
          }

          use_dsh() {
            HARNESS="dsh"
            SELECTED_MODEL="$DSH_MODEL"
            SELECTED_PROVIDER="deepseek-official"
            SELECTED_VARIANT=""
            CURRENT_MODEL="$SELECTED_MODEL"
            CURRENT_PROVIDER="$SELECTED_PROVIDER"
            export HARNESS SELECTED_MODEL SELECTED_PROVIDER SELECTED_VARIANT
            echo "[provider] 主 harness=dsh，模型=$SELECTED_MODEL"
          }

          switch_to_opencode() {
            HARNESS="opencode"
            SELECTED_MODEL=""
            SELECTED_PROVIDER=""
            SELECTED_VARIANT=""
            CURRENT_MODEL=""
            CURRENT_PROVIDER=""
            export HARNESS
            echo "[warn] dsh 不可用，切换到 opencode 兜底（调用方式与 2026-10-22 备份一致）"
            opencode_detect
          }

          select_harness_model() {
            if [ "$HARNESS" = "opencode" ]; then
              opencode_detect
              return $?
            fi
            if command -v dsh >/dev/null 2>&1; then
              use_dsh
              if timeout --kill-after=30 180 dsh --profile headless "只回复两个字：OK" > /tmp/dsh_smoke_test.log 2>&1; then
                return 0
              fi
              echo "[warn] dsh 冒烟测试失败（API key / 网络 / 配额 / 安装）"
            else
              echo "[warn] dsh 未安装"
            fi
            switch_to_opencode
          }

          if select_harness_model; then :; else echo "[warn] 启动时未选出可用模型，第一个阶段会再探测一次"; fi

          echo "HARNESS=$HARNESS" >> "$GITHUB_ENV"
          echo "MAIN_MODEL=$SELECTED_MODEL" >> "$GITHUB_ENV"
          echo "MAIN_VARIANT=$SELECTED_VARIANT" >> "$GITHUB_ENV"
          echo "JUDGE_MODEL=$SELECTED_MODEL" >> "$GITHUB_ENV"
          echo "JUDGE_VARIANT=$SELECTED_VARIANT" >> "$GITHUB_ENV"
          echo "XUEN_HARNESS=$HARNESS" >> "$GITHUB_ENV"
          echo "XUEN_MODEL=$SELECTED_MODEL" >> "$GITHUB_ENV"
          echo "XUEN_VARIANT=$SELECTED_VARIANT" >> "$GITHUB_ENV"
          echo "XUEN_JUDGE_MODEL=$SELECTED_MODEL" >> "$GITHUB_ENV"
          echo "XUEN_JUDGE_VARIANT=$SELECTED_VARIANT" >> "$GITHUB_ENV"
      - name: Restore workspace from xuen-loop branch
        run: |
          set -e
          if git ls-remote --exit-code --heads origin xuen-loop >/dev/null 2>&1; then
            git fetch origin xuen-loop --depth=1
            git checkout FETCH_HEAD -- workspace
            echo "[loop] 已从 xuen-loop 分支恢复工作区（上次的 research.md / words.txt / rounds/）"
            echo "--- workspace 概览 ---"
            ls -la workspace 2>/dev/null || true
            [ -f workspace/rounds/best.json ] \
              && cat workspace/rounds/best.json \
              || echo "[loop] 尚无最佳（首次运行）"
          else
            echo "[loop] xuen-loop 分支不存在：首次运行，从空工作区开始"
          fi

      - name: Write xuen config
        run: |
          set -e
          cat > /tmp/xuen_agent.sh <<'SHEOF'
          #!/usr/bin/env bash
          role="${1:-main}"
          prompt="${2:-}"
          if [ "${XUEN_HARNESS:-dsh}" = "dsh" ]; then
            dsh --profile headless "$prompt" && exit 0
            echo "[warn] xuen agent: dsh 调用失败，切换 opencode 兜底" >&2
          fi
          if [ "$role" = "judge" ]; then
            model="${XUEN_JUDGE_MODEL:-${XUEN_MODEL:-opencode/deepseek-v4.1-flash-free}}"
            variant="${XUEN_JUDGE_VARIANT:-}"
          else
            model="${XUEN_MODEL:-opencode/deepseek-v4.1-flash-free}"
            variant="${XUEN_VARIANT:-}"
          fi
          # dsh 的模型名不能用于 opencode：兜底时改用 opencode 免费模型
          case "$model" in
            deepseek-official/*|dsh/*)
              model="opencode/deepseek-v4.1-flash-free"
              variant=""
              ;;
          esac
          extra=""
          [ -n "$variant" ] && extra="--variant $variant"
          # shellcheck disable=SC2086
          exec opencode run -m "$model" $extra "$prompt"
          SHEOF
          chmod +x /tmp/xuen_agent.sh
          echo "[loop] HARNESS=${XUEN_HARNESS:-dsh} MAIN=${XUEN_MODEL:-默认} JUDGE=${XUEN_JUDGE_MODEL:-默认}"

          cat > config.yaml <<'EOF'
          # 本文件由 CI 生成：xuen 研究循环配置（任务：设计一个新的算法）
          agent:
            command: '/tmp/xuen_agent.sh main "$prompt"'
            timeout: 1500

          extra_notes: |
            请像一位严谨的算法研究者一样思考；
            先给直觉与动机，再给严谨的形式化定义；
            产物区维护完整的算法设计（符号定义、算法步骤、复杂度分析、
            正确性论证与已知风险），每轮迭代在前人基础上改进而不是推倒重来；
            每轮结尾用一句话指出当前方案最大的风险。

          prompt:
            max_state_chars: 60000

          words:
            count: 300
            batch: 100
            pick: 3
            reuse: true

          loop:
            iterations: inf

          # 轮次守卫：每轮快照 → 候选 → AI 评审（便宜模型当评审员）→ 晋升/还原。
          # 没有测试套件可跑（研究型任务），verify=ai 直接走评审员；
          # 评审失败/解析不出分数的候选挂起，绝不丢快照。
          rounds:
            enabled: true
            dir: rounds
            verify: ai
            fallback: ai
            adopt_score: 7
            verify_timeout: 600
            repo: ""
            judge_command: '/tmp/xuen_agent.sh judge "$prompt"'
            judge_timeout: 600

          tui: false
          color: false
          workspace: ./workspace
          EOF

          echo "=== config.yaml ==="
          cat config.yaml

      # ⭐ 关键 4：xuen 研究循环（约 165 分钟工作窗口）。
      # 进度按轮保存：每轮结束 research.md / rounds/ 都已落盘；窗口到点发
      # SIGINT 让 xuen 优雅收尾（守卫汇总 + 兑现待决评分），即使被硬杀，
      # 下次启动时守卫也会把状态拨回当前最佳，绝不丢已验证的进展。
      - name: Run xuen loop (~3h window)
        timeout-minutes: 175
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set +e
          WORK_SECONDS=9900        # 工作窗口：165 分钟
          echo "[loop] 任务：设计一个新的算法｜窗口 ${WORK_SECONDS}s｜模型：${MAIN_MODEL:-默认}"
          timeout --signal=INT --kill-after=60s "$WORK_SECONDS" \
            python3 main.py --no-tui --no-color "设计一个新的算法" -c config.yaml
          RC=$?
          case "$RC" in
            0)   echo "[loop] xuen 正常结束（进度已按轮持久化）" ;;
            124|137|143)
                 echo "[loop] 工作窗口到点，xuen 被截断（退出码 $RC；每轮进度已落盘）" ;;
            130) echo "[loop] xuen 收到中断信号，已优雅收尾（进度已持久化）" ;;
            *)   echo "::warning::xuen 退出码 $RC（进度不丢；下个 run 自动从最佳继续）" ;;
          esac
          exit 0

      # ⭐ 进度保存（跨 run）：把工作区 checkpoint 到专用 xuen-loop 分支。
      # 用 plumbing 提交（commit-tree + push），完全不动本地 master 分支：
      # master 保持干净（workspace 被 .gitignore 覆盖，仓库卫生测试不受影响），
      # xuen-loop 分支 = 最新代码快照 + 工作区进度，下次 run 开头恢复。
      - name: Checkpoint workspace to xuen-loop
        if: ${{ !cancelled() }}
        run: |
          set -e
          # 防御：外部 agent 若动过 .github / 遗留临时清单，先恢复原状
          git checkout HEAD -- .github 2>/dev/null || true
          git clean -fdq .github 2>/dev/null || true
          rm -f .opencode_issues.md
          if [ ! -d workspace ]; then
            echo "[loop] 工作区不存在（本轮未产生任何进度），跳过 checkpoint"
            exit 0
          fi
          git add -f workspace
          if git rev-parse --verify -q origin/xuen-loop >/dev/null; then
            PARENT="$(git rev-parse origin/xuen-loop)"
          else
            PARENT="$(git rev-parse HEAD)"
          fi
          TREE="$(git write-tree)"
          COMMIT="$(git commit-tree "$TREE" -p "$PARENT" \
            -m "chore(xuen): workspace checkpoint (run ${GITHUB_RUN_ID})")"
          git push origin "$COMMIT:refs/heads/xuen-loop"
          git reset -q   # 只清索引，工作区文件保留
          echo "[loop] 工作区已 checkpoint 到 xuen-loop 分支：${COMMIT:0:12}"

      - name: Push to Gitee
        if: ${{ !cancelled() }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPO" ]; then
            echo "GITEE_TOKEN or GITEE_REPO not set, skipping Gitee push."
            exit 0
          fi
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git push gitee "HEAD:${GITHUB_REF_NAME}" || echo "[warn] push to Gitee failed"

  # ⭐ 立刻续跑（下）：独立的收尾 job。
  # needs + if: always()：工作 job 无论成功、失败、超时被取消，这个 job 都会
  # 紧接着启动。这里无条件派发一个新的后继 run：它在组内排队，本 run 退出
  # 的一瞬间就被调度。万一这个 job 连启动都没机会（整个 run 被强杀），
  # */15 心跳会兜底。
  next-run:
    needs: [run-xuen]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Ensure next run is queued
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              echo "[loop] 已派发后继 run（attempt ${attempt}）——本 run 结束后立刻起跑"
              exit 0
            fi
            echo "[loop][warn] 派发失败（attempt ${attempt}）10s 后重试"
            sleep 10
          done
          echo "[loop][warn] 派发失败；下一次 */15 心跳会补位"
          exit 0
