name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Check Python file size
        run: python scripts/check_file_size.py

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run test suite
        # workspace/ 是研究工作区（agent 生成的实验脚本 + vendored 依赖，
        # 非仓库代码）：与 continuous-loop 前置测试门口径对齐，不参与
        # 收集，否则破损实验脚本的收集错误会让 CI 持续红。
        run: python -m pytest -q --ignore=workspace