# ============================================================
# xuen 配置示例
#
# 快速开始：
#   1. cp config.example.yaml config.yaml
#   2. 修改 agent.command，让它调用你实际使用的外部 agent
#   3. python main.py "你的研究任务"
#
# 配置查找顺序：
#   -c/--config 指定的路径 → ./config.yaml → ./config.yml → ./xuen.yaml
#
# 配置文件本身必须存在；除 agent.command 外，其余字段都可以省略。
# 命令行参数的优先级高于配置文件。
#
# xuen 只负责组织循环、维护状态与保存进度。每轮把任务、灵感词、
# 当前想法区/产物区和写入说明拼成提示词，交给外部 agent。
# ============================================================


# ============================================================
# 一、外部 agent（唯一必填项）
# ============================================================
# 唯一必填项：agent.command，用于指定每轮外部 agent 的执行命令
# ============================================================

agent:
  # 命令模板必须包含一个会被实际替换的提示词占位符：
  #
  #   $prompt       整段提示词按当前 shell 语境转义后替换
  #   $prompt_file  提示词写入工作区内本次运行唯一的 .prompt.XXXXXX.md，
  #                 占位符替换为该文件路径，运行结束后自动清理
  #
  # 推荐使用 $prompt_file：
  #   - 不受系统单参数长度限制
  #   - 提示词随轮次增长时更稳定
  #   - 在 Windows / macOS / Linux 上行为一致
  #
  # 占位符必须位于会被实际执行的命令位置。若仅出现在注释、heredoc
  # 正文或其它无法安全解析的展开语境中，配置校验会报错。
  command: 'opencode run "$prompt_file"'

  # 其它常见 agent 的示例（取消注释后只保留一条 command）：
  # command: 'opencode run "$prompt"'
  # command: 'claude -p "$prompt"'
  # command: 'aider --message-file "$prompt_file"'

  # 单次外部调用超时（秒）。
  # 超时后终止整个进程树；TUI 中按 q / Ctrl+C 也会先终止 agent。
  timeout: 1800


# ============================================================
# 二、提示词
# ============================================================

# 额外的全局说明，会拼进每轮提示词开头。
# 用于描述研究风格、输出要求或长期约束；如不需要可删除。
extra_notes: |
  请像一位严谨的跨学科研究者一样思考；
  先给出直觉解释，再给出严谨定义；
  每轮结尾用一句话指出当前方案的最大风险。

# 每轮提示词都会包含完整的想法区与产物区，随着轮次增加会增长。
# 超过此限制时仅截断提示词副本：保留首尾并标注省略字符数。
# 工作区里的完整内容不变。0 表示不限制。
prompt:
  max_state_chars: 60000


# ============================================================
# 三、领域词库与循环
# ============================================================

# 首次运行时由外部 agent 分批生成词库，保存至 <workspace>/words.txt。
# 每轮从词库中纯随机抽取灵感词，抽样过程不调用模型。
words:
  count: 1000     # 目标词数（正整数）
  batch: 100      # 每批请求的词数
  pick: 2         # 每轮抽取的灵感词数量（>= 0；0 = 不使用灵感词）
  reuse: true     # words.txt 已存在时是否直接复用；false 强制重新生成
                  # （--regen-words 同样会忽略旧词库）

loop:
  # 循环轮数（正整数）；写 inf 表示无限循环。
  # TUI 下输入框为空时按 q 结束；纯终端模式用 Ctrl+C 中断。
  iterations: 5


# ============================================================
# 四、轮次守卫
# ============================================================

# 外部 agent 每轮会整体覆盖想法区/产物区。守卫在覆盖后保存候选快照，
# 只有通过验证的内容才晋升为「当前最佳」；验证失败或待评分的候选
# 会将 research.md 还原为最佳。
#
#   1. 每轮改动先保存为 rounds/cand-<id>.md
#   2. 候选与最佳分离：仅当验证通过时才晋升
#   3. 所有事件追加写入 rounds/history.jsonl
#
# 如不需要守卫，可将 enabled 设为 false，或在运行时添加 --no-rounds。
rounds:
  enabled: true

  # 守卫目录（相对 workspace）。
  dir: rounds

  # 候选验证方式：
  #
  #   auto  若存在可运行的测试套件则执行测试；无可用套件时使用
  #         fallback 指定的评分者（user / ai）
  #
  #   tests 仅运行测试；无套件或套件无法运行时，候选挂起等待用户评分
  #
  #   user  仅使用用户评分：在 <workspace>/rounds/verdicts.txt 追加
  #         「<候选id> <0-10分> [评语]」
  #
  #   ai    仅使用 AI 评分：复用外部 agent 作为评审员
  #
  #   off   不进行验证：快照照存，最新即最佳（防丢失模式）
  verify: auto

  # auto 模式在没有可用测试套件时使用的兜底评分者：user / ai。
  fallback: ai

  # 评分达到该阈值才采纳候选为最佳（0-10）。
  adopt_score: 7

  # 单次测试套件运行超时（秒）。
  verify_timeout: 600

  # 测试验证的目标目录。留空表示自动探测：
  # 从工作区向上查找 git 仓库根；非 git 环境则使用工作区本身。
  repo: ""

  # AI 评审命令模板（ai / auto+fallback=ai 使用）。
  # 留空表示复用 agent.command。
  # 必须包含 $prompt 或 $prompt_file。
  judge_command: ""

  # AI 评审单次调用超时（秒）。
  judge_timeout: 600


# ============================================================
# 五、界面与工作区
# ============================================================

# 启用 TUI：想法区/产物区面板 + 输出日志 + 状态栏 + 底部输入框。
# --no-tui 可关闭；未安装 textual 或 stdin/stdout 不是终端时，自动降级。
tui: true

# 纯终端输出（--no-tui）时是否使用颜色；--no-color 可关闭。
color: true

# research.md、words.txt、write_section.py 与 rounds/ 都放在这里。
workspace: ./workspace